name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # O torch padrão do PyPI no Linux traz bibliotecas CUDA pesadas; a CI só precisa de CPU.
      - name: Instala PyTorch para CPU
        run: pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Instala dependências
        run: pip install -r requirements.txt
      - name: Roda os testes
        run: pytest -q
